# Vhost complet de pilotage.medactio.fr — étape 2, une fois le certificat émis.
# Remplace /etc/apache2/sites-available/pilotage.medactio.fr.conf
#
# Ce fichier est propre au sous-domaine : il ne modifie aucun vhost existant.

<VirtualHost *:80>
    ServerName pilotage.medactio.fr

    Alias /.well-known/acme-challenge/ /var/www/pilotage-acme/.well-known/acme-challenge/
    <Directory /var/www/pilotage-acme/.well-known/acme-challenge/>
        Require all granted
        Options None
    </Directory>

    # Hors renouvellement du certificat, tout passe en HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*) https://pilotage.medactio.fr/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/pilotage-error.log
    CustomLog ${APACHE_LOG_DIR}/pilotage-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName pilotage.medactio.fr

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/pilotage.medactio.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilotage.medactio.fr/privkey.pem

    # L'outil est interne et manipule des données commerciales et financières.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:4100/
    ProxyPassReverse / http://127.0.0.1:4100/

    ErrorLog ${APACHE_LOG_DIR}/pilotage-error.log
    CustomLog ${APACHE_LOG_DIR}/pilotage-access.log combined
</VirtualHost>
