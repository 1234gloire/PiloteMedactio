# Vhost HTTP de pilotage.medactio.fr — étape 1, avant le certificat.
# À installer dans /etc/apache2/sites-available/pilotage.medactio.fr.conf
#
# Ce fichier est propre au sous-domaine : il ne modifie aucun vhost existant.

<VirtualHost *:80>
    ServerName pilotage.medactio.fr

    # Répertoire dédié à la validation Let's Encrypt.
    Alias /.well-known/acme-challenge/ /var/www/pilotage-acme/.well-known/acme-challenge/
    <Directory /var/www/pilotage-acme/.well-known/acme-challenge/>
        Require all granted
        Options None
    </Directory>

    # Tout le reste est relayé vers l'application Node.
    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:4100/
    ProxyPassReverse / http://127.0.0.1:4100/

    ErrorLog ${APACHE_LOG_DIR}/pilotage-error.log
    CustomLog ${APACHE_LOG_DIR}/pilotage-access.log combined
</VirtualHost>
